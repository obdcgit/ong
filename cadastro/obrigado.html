<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro Enviado! – Hope Kids</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family:'Nunito',sans-serif; background:linear-gradient(160deg,#005F94,#29ABE2,#7DD4F0); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
    .card { background:#fff; border-radius:24px; padding:48px 36px; text-align:center; max-width:480px; box-shadow:0 20px 60px rgba(0,0,0,.2); }
    .icon { font-size:80px; margin-bottom:16px; }
    h1 { font-family:'Fredoka One',cursive; font-size:2.4rem; color:#5D9E1F; margin-bottom:10px; }
    p { font-size:1rem; color:#718096; font-weight:600; line-height:1.7; margin-bottom:24px; }
    a { display:inline-block; background:linear-gradient(135deg,#8DC63F,#5D9E1F); color:#fff; font-weight:900; padding:14px 32px; border-radius:50px; text-decoration:none; font-size:15px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🌍✨</div>
    <h1>Cadastro Enviado!</h1>
    <p>Recebemos o cadastro com sucesso! Em breve nossa equipe entrará em contato para confirmação.<br><br>Que Deus abençoe cada criança do Hope Kids! 🙏</p>
    <a href="/">← Voltar ao início</a>
  </div>
</body>
</html>
